[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openagent-cli"
version = "0.16.0-beta.1"
description = "CLI client for OpenAgent — connects to any OpenAgent Gateway"
requires-python = ">=3.11"
license = "MIT"

dependencies = [
    "aiohttp>=3.9",
    "click>=8.0",
    "rich>=13.0",
    # The standalone ``openagent_cli.network`` package implements the
    # client side of the Iroh/certificate protocol.  Keep these explicit:
    # an installed wheel must not rely on the unpublished server package.
    "iroh==0.35.0",
    "cbor2>=5.6",
    "srptools>=1.0",
    "cryptography>=42",
]

[project.scripts]
openagent-cli = "openagent_cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["openagent_cli*"]
namespaces = false
