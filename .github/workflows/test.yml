name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  cli:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Acquire the consumer-pinned host-tools dependency
        shell: bash
        run: |
          set -euo pipefail
          python scripts/acquire-host-tools.py \
            --platform linux-x64 \
            --output "$RUNNER_TEMP/openagent-host-tools" \
            --wheel-output "$RUNNER_TEMP/openagent-host-tools.whl"
          python -m pip install "$RUNNER_TEMP/openagent-host-tools.whl"
      - name: Run the full CLI suite
        run: |
          python -m pip install -e . pytest
          python -m pytest -q
