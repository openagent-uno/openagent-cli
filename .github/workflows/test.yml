name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  cli:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Acquire the consumer-pinned host-tools dependency
        shell: bash
        run: |
          set -euo pipefail
          HOST_TOOLS_WHEEL="$RUNNER_TEMP/openagent_host_tools-0.1.2-py3-none-any.whl"
          python scripts/acquire-host-tools.py \
            --platform linux-x64 \
            --output "$RUNNER_TEMP/openagent-host-tools" \
            --wheel-output "$HOST_TOOLS_WHEEL"
          python -m pip install "$HOST_TOOLS_WHEEL"
      - name: Run the full CLI suite
        run: |
          python -m pip install -e . pytest pytest-asyncio
          python -m pytest -q
