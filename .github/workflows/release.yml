name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Acquire the consumer-pinned host-tools dependency
        shell: bash
        run: |
          set -euo pipefail
          HOST_TOOLS_WHEEL="$RUNNER_TEMP/openagent_host_tools-0.1.1-py3-none-any.whl"
          python scripts/acquire-host-tools.py \
            --platform linux-x64 \
            --output "$RUNNER_TEMP/openagent-host-tools" \
            --wheel-output "$HOST_TOOLS_WHEEL"
          python -m pip install "$HOST_TOOLS_WHEEL"
      - name: Run the full CLI suite
        run: |
          python -m pip install -e . pytest pytest-asyncio
          python -m pytest -q

  cli:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            platform: darwin-x64
          - os: macos-15
            platform: darwin-arm64
          - os: ubuntu-24.04
            platform: linux-x64
          - os: ubuntu-24.04-arm
            platform: linux-arm64
          - os: windows-2025
            platform: win32-x64
          - os: windows-11-arm
            platform: win32-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Acquire checksum-pinned host-tools wheel and native bundle
        shell: bash
        run: |
          set -euo pipefail
          HOST_TOOLS_WHEEL="$RUNNER_TEMP/openagent_host_tools-0.1.1-py3-none-any.whl"
          python scripts/acquire-host-tools.py \
            --platform '${{ matrix.platform }}' \
            --output "$RUNNER_TEMP/openagent-host-tools" \
            --wheel-output "$HOST_TOOLS_WHEEL"
          echo "OPENAGENT_HOST_TOOLS_WHEEL=$HOST_TOOLS_WHEEL" >> "$GITHUB_ENV"
          echo "OPENAGENT_HOST_TOOLS_BUNDLE=$RUNNER_TEMP/openagent-host-tools/${{ matrix.platform }}" >> "$GITHUB_ENV"
      - name: Install CLI deps + PyInstaller
        shell: bash
        run: |
          python -m pip install "$OPENAGENT_HOST_TOOLS_WHEEL"
          python -m pip install -e . pyinstaller
      - name: Build CLI executable
        env:
          OPENAGENT_RELEASE_BUILD: '1'
        run: pyinstaller cli.spec --clean --noconfirm
      - name: Sign + notarize macOS CLI binary (+ build stapled .pkg)
        if: runner.os == 'macOS'
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          CSC_LINK_INSTALLER: ${{ secrets.CSC_LINK_INSTALLER }}
          CSC_KEY_PASSWORD_INSTALLER: ${{ secrets.CSC_KEY_PASSWORD_INSTALLER }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          OPENAGENT_REQUIRE_SIGNING: '1'
        shell: bash
        run: >-
          bash scripts/sign-notarize-macos.sh
          dist/openagent-cli com.openagent.cli /usr/local/bin ""
          "$OPENAGENT_HOST_TOOLS_BUNDLE"
      - name: Package + checksum
        shell: bash
        run: bash scripts/package-release.sh openagent-cli dist
      - name: Smoke frozen broker twice, explicit plugin, and five-module catalog
        shell: bash
        run: python scripts/smoke-frozen-local-tools.py dist/openagent-cli
      - uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.platform }}
          path: |
            dist/openagent-cli-*.tar.gz
            dist/openagent-cli-*.zip
            dist/openagent-cli-*.sha256
            dist/openagent-cli-*.pkg

  release:
    needs: cli
    if: always() && needs.cli.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: List artifacts
        run: find artifacts -type f | head -40
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*.tar.gz
            artifacts/**/*.zip
            artifacts/**/*.sha256
            artifacts/**/*.pkg
          generate_release_notes: true
