name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: release-${{ github.repository }}-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  verify-tag:
    name: verify tag and source version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Require an exact SemVer tag matching pyproject.toml
        shell: bash
        run: |
          set -euo pipefail
          version=$(python -c 'import pathlib, tomllib; print(tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"])')
          source_version=$(python -c 'from src import __version__; print(__version__)')
          cli_version=$(PYTHONPATH=src python -c 'from openagent_cli import __version__; print(__version__)')
          [[ "$version" == "$source_version" ]]
          [[ "$version" == "$cli_version" ]]
          [[ "$GITHUB_REF_NAME" == "v$version" ]]
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-beta\.[0-9]+)?$ ]]

  test:
    name: unit and isolated packaging tests
    needs: verify-tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install CLI
        run: python -m pip install -e .
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Install uv
        run: python -m pip install uv
      - name: Verify isolated wheel install and frozen binary
        env:
          OPENAGENT_PACKAGING_PYTHON: '3.12'
        run: bash scripts/test-packaging.sh full

  cli:
    needs: [verify-tag, test]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
          - os: ubuntu-latest
          - os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CLI deps + PyInstaller
        run: pip install -e . pyinstaller
      - name: Build CLI executable
        run: pyinstaller cli.spec --clean --noconfirm
      - name: Sign + notarize macOS CLI binary (+ build stapled .pkg)
        if: runner.os == 'macOS'
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          CSC_LINK_INSTALLER: ${{ secrets.CSC_LINK_INSTALLER }}
          CSC_KEY_PASSWORD_INSTALLER: ${{ secrets.CSC_KEY_PASSWORD_INSTALLER }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        shell: bash
        run: bash scripts/sign-notarize-macos.sh dist/openagent-cli com.openagent.cli /usr/local/bin
      - name: Launch-smoke the exact frozen binary
        shell: bash
        run: |
          set -euo pipefail
          version=$(python -c 'from src import __version__; print(__version__)')
          expected="openagent-cli, version $version"
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            [[ "$(./dist/openagent-cli.exe --version)" == "$expected" ]]
            ./dist/openagent-cli.exe --help >/dev/null
            ./dist/openagent-cli.exe server-info --help >/dev/null
          else
            [[ "$(./dist/openagent-cli --version)" == "$expected" ]]
            ./dist/openagent-cli --help >/dev/null
            ./dist/openagent-cli server-info --help >/dev/null
          fi
      - name: Package + checksum
        shell: bash
        run: bash scripts/package-release.sh openagent-cli dist
      - name: Verify checksum and extracted final package
        shell: bash
        run: |
          set -euo pipefail
          version=$(python -c 'from src import __version__; print(__version__)')
          bash scripts/test-release-package.sh openagent-cli dist "$version"
      - uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.os }}
          path: |
            dist/openagent-cli-*.tar.gz
            dist/openagent-cli-*.zip
            dist/openagent-cli-*.sha256
            dist/openagent-cli-*.pkg

  release:
    needs: cli
    if: always() && needs.cli.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: cli-*
          path: artifacts
          merge-multiple: true
      - name: Verify exact asset set and checksums
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          python scripts/verify-release-assets.py artifacts "$version"
      - name: Refuse to replace an existing release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          existing_tags=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" --jq '.[].tag_name')
          if grep -Fqx -- "$GITHUB_REF_NAME" <<<"$existing_tags"; then
            echo "Release ${GITHUB_REF_NAME} already exists; publish a new beta tag instead."
            exit 1
          fi
      - name: Attest exact release assets
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: |
            artifacts/**/*.tar.gz
            artifacts/**/*.zip
            artifacts/**/*.pkg
            artifacts/**/*.sha256
      - name: Upload an unpublished draft release
        id: draft
        uses: softprops/action-gh-release@v2.6.2
        with:
          draft: true
          files: |
            artifacts/**/*.tar.gz
            artifacts/**/*.zip
            artifacts/**/*.sha256
            artifacts/**/*.pkg
          generate_release_notes: true
          fail_on_unmatched_files: true
          overwrite_files: false
          prerelease: ${{ contains(github.ref_name, '-beta.') }}
          make_latest: ${{ contains(github.ref_name, '-beta.') && 'false' || 'true' }}
      - name: Verify uploaded bytes, then publish atomically
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ steps.draft.outputs.id }}
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          is_beta=false
          make_latest=true
          if [[ "$version" == *-beta.* ]]; then
            is_beta=true
            make_latest=false
          fi
          gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" > release-draft.json
          python scripts/verify-release-assets.py artifacts "$version" \
            --release-json release-draft.json \
            --expect-draft true \
            --expect-prerelease "$is_beta"
          python - "$is_beta" "$make_latest" > publish.json <<'PY'
          import json, sys
          json.dump({
              "draft": False,
              "prerelease": sys.argv[1] == "true",
              "make_latest": sys.argv[2],
          }, sys.stdout)
          PY
          gh api --method PATCH \
            "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
            --input publish.json > release-published.json
          python scripts/verify-release-assets.py artifacts "$version" \
            --release-json release-published.json \
            --expect-draft false \
            --expect-prerelease "$is_beta"
