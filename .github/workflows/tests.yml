name: Tests

on:
  pull_request:
  push:
    branches:
      - main
      - 'beta/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install CLI
        run: python -m pip install -e .
      - name: Run unit tests
        run: python -m unittest discover -s tests -v

  packaging:
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: '3.11'
            mode: wheel-only
          - python-version: '3.12'
            mode: full
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        run: python -m pip install uv
      - name: Verify isolated distribution
        env:
          OPENAGENT_PACKAGING_PYTHON: ${{ matrix.python-version }}
        run: bash scripts/test-packaging.sh ${{ matrix.mode }}
